version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - gocritic
    - gosec
    - bodyclose
    - errorlint
    - nilerr
    - prealloc
    - unconvert
    - whitespace
    - godot
    - lll
  settings:
    lll:
      line-length: 140
    godot:
      scope: declarations
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - lll
          - errcheck
          - gosec
          - revive

formatters:
  enable:
    - gofmt
    - goimports
